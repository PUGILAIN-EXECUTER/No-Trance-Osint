<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NoTrace — OSINT Intelligence Workspace</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
    --bg:#050505;
    --panel:#0b0b0b;
    --panel2:#101010;
    --panel3:#151515;
    --line:#242424;
    --line2:#303030;
    --text:#f5f5f5;
    --muted:#8b8b8b;
    --muted2:#5e5e5e;
    --white:#fff;
    --black:#000;
    --danger:#e5e5e5;
    --shadow:0 20px 60px rgba(0,0,0,.55);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

svg{
    shape-rendering:geometricPrecision;
    stroke-linecap:round;
    stroke-linejoin:round;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:2px solid #666;
    outline-offset:2px;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    user-select:none;
}

button,
input,
select{
    font:inherit;
}

button{
    color:inherit;
}

#app{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 38%),
        #050505;
}

#workspace{
    position:absolute;
    inset:0;
    overflow:hidden;
    cursor:grab;
}

#workspace.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;
    width:1px;
    height:1px;
    left:0;
    top:0;
    transform-origin:0 0;
}

#grid{
    position:absolute;
    inset:-100000px;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:56px 56px;
    background-position:0 0;
}

#edges{
    position:absolute;
    left:-10000px;
    top:-10000px;
    width:20000px;
    height:20000px;
    overflow:visible;
    pointer-events:none;
}

.edge{
    stroke:#393939;
    stroke-width:1.5;
    fill:none;
}

.edge.active{
    stroke:#aaa;
}

#nodes{
    position:absolute;
    left:0;
    top:0;
}

.node{
    position:absolute;
    width:230px;
    min-height:92px;
    transform:translate(-50%,-50%);
    background:rgba(12,12,12,.97);
    border:1px solid #292929;
    border-radius:13px;
    box-shadow:0 18px 45px rgba(0,0,0,.48);
    backdrop-filter:blur(16px);
    cursor:pointer;
    transition:
        border-color .16s ease,
        box-shadow .16s ease,
        transform .12s ease;
}

.node:hover{
    border-color:#555;
    box-shadow:0 24px 60px rgba(0,0,0,.62);
}

.node.selected{
    border-color:#fff;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 25px 65px rgba(0,0,0,.7);
}

.node-header{
    height:37px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 12px;
    border-bottom:1px solid #222;
}

.node-logo{
    width:19px;
    height:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    flex:0 0 19px;
}

.node-logo svg{
    width:18px;
    height:18px;
}

.node-source{
    font-size:10px;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:#9a9a9a;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.node-body{
    padding:12px;
}

.node-title{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    word-break:break-word;
}

.node-sub{
    margin-top:5px;
    color:#737373;
    font-family:"JetBrains Mono",monospace;
    font-size:9px;
    line-height:1.45;
    word-break:break-word;
}

.node-url{
    margin-top:8px;
    color:#aaa;
    font-family:"JetBrains Mono",monospace;
    font-size:8px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.node.target{
    width:270px;
    min-height:112px;
    border-color:#555;
}

.node.target .node-header{
    border-bottom-color:#333;
}

.node.target .node-title{
    font-size:15px;
}

.node.source{
    border-color:#303030;
}

.node.source:hover{
    border-color:#666;
}

.node.tool{
    width:215px;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:78px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 24px;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(5,5,5,.98),
            rgba(5,5,5,.76),
            transparent
        );
}

#brand{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-mark{
    width:31px;
    height:31px;
    border:1px solid #4a4a4a;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0b;
}

.brand-mark svg{
    width:17px;
    height:17px;
}

.brand-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:1.4px;
}

.brand-version{
    color:#606060;
    font:9px "JetBrains Mono",monospace;
    margin-left:3px;
}

#searchbar{
    position:fixed;
    left:50%;
    top:16px;
    transform:translateX(-50%);
    width:min(720px,calc(100vw - 520px));
    min-width:420px;
    z-index:1100;
    pointer-events:auto;
}

.search-shell{
    height:46px;
    border:1px solid #303030;
    background:rgba(10,10,10,.94);
    border-radius:12px;
    display:flex;
    align-items:center;
    padding:4px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
}

.search-icon{
    width:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
}

.search-icon svg{
    width:17px;
}

#targetInput{
    flex:1;
    height:100%;
    background:none;
    border:0;
    outline:0;
    color:#fff;
    font:12px "JetBrains Mono",monospace;
}

#targetInput::placeholder{
    color:#565656;
}

#sourceSelect{
    height:34px;
    max-width:155px;
    background:#111;
    color:#bbb;
    border:1px solid #292929;
    border-radius:8px;
    outline:none;
    padding:0 9px;
    font-size:10px;
    cursor:pointer;
}

#runSearch{
    height:34px;
    padding:0 16px;
    margin-left:5px;
    border:0;
    border-radius:8px;
    background:#f5f5f5;
    color:#050505;
    font-size:10px;
    font-weight:700;
    letter-spacing:.7px;
    cursor:pointer;
}

#runSearch:hover{
    background:#fff;
}

#runSearch:active{
    transform:scale(.98);
}

#top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    pointer-events:auto;
}

.top-button{
    height:34px;
    min-width:34px;
    padding:0 10px;
    border:1px solid #272727;
    background:rgba(10,10,10,.86);
    color:#999;
    border-radius:8px;
    cursor:pointer;
    font-size:10px;
}

.top-button:hover{
    color:#fff;
    border-color:#4a4a4a;
}

#selectionBar{
    position:fixed;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:900;
    display:none;
    align-items:center;
    gap:8px;
    padding:7px;
    border:1px solid #272727;
    background:rgba(8,8,8,.9);
    border-radius:10px;
    backdrop-filter:blur(15px);
}

#selectionBar.visible{
    display:flex;
}

.selection-text{
    color:#777;
    font:9px "JetBrains Mono",monospace;
    padding:0 8px;
}

.small-action{
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    border-radius:6px;
    height:27px;
    padding:0 9px;
    font-size:9px;
    cursor:pointer;
}

.small-action:hover{
    color:#fff;
    border-color:#555;
}

#contextMenu{
    position:fixed;
    display:none;
    width:255px;
    padding:6px;
    background:rgba(12,12,12,.98);
    border:1px solid #303030;
    border-radius:11px;
    box-shadow:0 25px 80px rgba(0,0,0,.75);
    z-index:99999;
    backdrop-filter:blur(20px);
}

.context-title{
    padding:9px 10px;
    color:#666;
    font:9px "JetBrains Mono",monospace;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.context-item{
    width:100%;
    height:34px;
    display:flex;
    align-items:center;
    gap:10px;
    border:0;
    background:transparent;
    color:#aaa;
    border-radius:7px;
    padding:0 10px;
    text-align:left;
    font-size:10px;
    cursor:pointer;
}

.context-item:hover{
    color:#fff;
    background:#191919;
}

.context-item svg{
    width:14px;
    height:14px;
    color:#777;
}

.context-separator{
    height:1px;
    background:#222;
    margin:5px 2px;
}

#toolbox{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:1200;
    display:flex;
    align-items:center;
    gap:4px;
    padding:6px;
    border:1px solid #252525;
    background:rgba(9,9,9,.92);
    border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    backdrop-filter:blur(20px);
}

.tool-button{
    height:32px;
    padding:0 11px;
    display:flex;
    align-items:center;
    gap:7px;
    background:transparent;
    border:0;
    border-radius:7px;
    color:#777;
    font-size:9px;
    cursor:pointer;
}

.tool-button:hover{
    color:#fff;
    background:#171717;
}

.tool-button svg{
    width:14px;
    height:14px;
}

#status{
    position:fixed;
    left:23px;
    bottom:24px;
    z-index:1100;
    color:#555;
    font:9px "JetBrains Mono",monospace;
    pointer-events:none;
}

#zoom{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:1100;
    display:flex;
    align-items:center;
    gap:5px;
}

.zoom-button{
    width:31px;
    height:31px;
    border:1px solid #272727;
    background:#0b0b0b;
    color:#777;
    border-radius:7px;
    cursor:pointer;
}

.zoom-button:hover{
    color:#fff;
    border-color:#444;
}

#zoomValue{
    color:#666;
    font:9px "JetBrains Mono",monospace;
    width:44px;
    text-align:center;
}

#toast{
    position:fixed;
    left:50%;
    bottom:78px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    z-index:99999;
    padding:10px 15px;
    background:#111;
    border:1px solid #383838;
    border-radius:8px;
    color:#ccc;
    font:9px "JetBrains Mono",monospace;
    transition:.22s ease;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

#modal{
    position:fixed;
    inset:0;
    z-index:99990;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(9px);
}

#modal.visible{
    display:flex;
}

.modal-box{
    width:min(760px,calc(100vw - 30px));
    max-height:min(760px,calc(100vh - 40px));
    overflow:auto;
    background:#0b0b0b;
    border:1px solid #2d2d2d;
    border-radius:15px;
    box-shadow:0 35px 120px rgba(0,0,0,.8);
}

.modal-head{
    height:56px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
}

.modal-title{
    font-size:12px;
    font-weight:600;
}

.modal-close{
    width:30px;
    height:30px;
    border:0;
    background:#151515;
    color:#777;
    border-radius:7px;
    cursor:pointer;
}

.modal-body{
    padding:18px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font:9px "JetBrains Mono",monospace;
    text-transform:uppercase;
}

.field input,
.field select{
    width:100%;
    height:40px;
    background:#111;
    border:1px solid #282828;
    border-radius:8px;
    color:#ddd;
    padding:0 11px;
    outline:none;
    font-size:11px;
}

.field input:focus,
.field select:focus{
    border-color:#555;
}

.dork-list{
    display:grid;
    gap:6px;
}

.dork{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:42px;
    padding:8px 10px;
    background:#101010;
    border:1px solid #222;
    border-radius:8px;
}

.dork-code{
    color:#aaa;
    font:9px "JetBrains Mono",monospace;
    word-break:break-all;
}

.dork-open{
    flex:0 0 auto;
    height:27px;
    padding:0 9px;
    border:1px solid #303030;
    background:#151515;
    color:#888;
    border-radius:6px;
    font-size:9px;
    cursor:pointer;
}

.dork-open:hover{
    color:#fff;
}

.tool-section{
    margin-bottom:16px;
}

.tool-section:last-child{
    margin-bottom:0;
}

.tool-section-title{
    color:#666;
    font:9px "JetBrains Mono",monospace;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:8px;
    padding-left:2px;
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.tool-card{
    min-height:76px;
    padding:12px;
    background:#101010;
    border:1px solid #222;
    border-radius:9px;
    cursor:pointer;
}

.tool-card:hover{
    border-color:#4b4b4b;
    background:#141414;
}

.tool-card-icon{
    width:25px;
    height:25px;
    margin-bottom:8px;
    color:#bbb;
}

.tool-card-icon svg{
    width:100%;
    height:100%;
}

.tool-card-name{
    font-size:10px;
    color:#ccc;
}

.tool-card-cat{
    margin-top:4px;
    color:#555;
    font:8px "JetBrains Mono",monospace;
}

.source-info{
    padding:12px;
    background:#101010;
    border:1px solid #222;
    border-radius:9px;
    margin-bottom:10px;
}

.source-info-title{
    color:#ddd;
    font-size:11px;
    margin-bottom:5px;
}

.source-info-text{
    color:#686868;
    font:9px "JetBrains Mono",monospace;
    line-height:1.5;
}

#loading{
    position:fixed;
    inset:0;
    z-index:8000;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

#loading.active{
    display:flex;
}

.loading-orbit{
    position:relative;
    width:130px;
    height:130px;
}

.loading-ring{
    position:absolute;
    inset:0;
    border:1px solid #292929;
    border-radius:50%;
    animation:spin 2.5s linear infinite;
}

.loading-ring:nth-child(2){
    inset:18px;
    animation-duration:1.7s;
    animation-direction:reverse;
}

.loading-ring:nth-child(3){
    inset:36px;
    animation-duration:1.2s;
}

.loading-core{
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 35px rgba(255,255,255,.35);
}

.loading-text{
    position:absolute;
    top:calc(100% + 18px);
    width:300px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:#777;
    font:9px "JetBrains Mono",monospace;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:900px){
    #searchbar{
        width:calc(100vw - 180px);
        min-width:0;
    }

    #top-actions{
        display:none;
    }

    .tool-grid{
        grid-template-columns:repeat(2,1fr);
    }

    #toolbox{
        max-width:calc(100vw - 30px);
        overflow:auto;
    }
}

@media(max-width:650px){
    #brand{
        display:none;
    }

    #searchbar{
        left:15px;
        right:15px;
        top:12px;
        width:auto;
        transform:none;
    }

    #sourceSelect{
        display:none;
    }

    #targetInput{
        font-size:11px;
    }

    #toolbox{
        bottom:12px;
    }

    #status{
        display:none;
    }

    #zoom{
        right:12px;
        bottom:65px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="workspace">
        <div id="grid"></div>

        <div id="world">
            <svg id="edges">
                <g id="edgeLayer"></g>
            </svg>
            <div id="nodes"></div>
        </div>
    </div>

    <header id="topbar">

        <div id="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M5 4h14v16H5z"/>
                    <path d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">NOTRACE</div>
                <span class="brand-version">OSINT WORKSPACE</span>
            </div>
        </div>

        <div id="searchbar">
            <div class="search-shell">

                <div class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="11" cy="11" r="6.5"/>
                        <path d="m16 16 5 5"/>
                    </svg>
                </div>

                <input
                    id="targetInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    maxlength="200"
                    placeholder="Inserisci target..."
                >

                <select id="sourceSelect">
                    <option value="username">Username</option>
                    <option value="email">Email</option>
                    <option value="ip">IP address</option>
                    <option value="domain">Dominio</option>
                    <option value="name">Nome / cognome</option>
                    <option value="phone">Numero telefonico</option>
                    <option value="url">URL</option>
                    <option value="keyword">Keyword</option>
                </select>

                <button id="runSearch">ANALYZE</button>

            </div>
        </div>

        <div id="top-actions">
            <button class="top-button" id="sourcesButton">SOURCES</button>
            <button class="top-button" id="dorksButton">DORKS</button>
            <button class="top-button" id="toolsButton">TOOLS</button>
            <button class="top-button" id="resetButton">RESET</button>
        </div>

    </header>

    <div id="selectionBar">
        <span class="selection-text" id="selectionText">NODE SELECTED</span>
        <button class="small-action" id="openSelected">OPEN</button>
        <button class="small-action" id="searchSelected">SEARCH</button>
        <button class="small-action" id="deleteSelected">DELETE</button>
    </div>

    <div id="contextMenu">

        <div class="context-title" id="contextTitle">NODE ACTIONS</div>

        <button class="context-item" data-action="add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Add connected node
        </button>

        <button class="context-item" data-action="source">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="8"/>
                <path d="M12 8v8M8 12h8"/>
            </svg>
            Add source
        </button>

        <button class="context-item" data-action="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="10.5" cy="10.5" r="6"/>
                <path d="m15 15 5 5"/>
            </svg>
            Search web
        </button>

        <button class="context-item" data-action="dorks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 6h16M4 12h11M4 18h16"/>
            </svg>
            Google dorks
        </button>

        <button class="context-item" data-action="tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>
            </svg>
            Extract tools
        </button>

const NODE_DIMENSIONS={
    target:{width:270,height:112},
    source:{width:230,height:92},
    tool:{width:215,height:92}
};

function getNodeRect(node){
    const dim=NODE_DIMENSIONS[node.type] || NODE_DIMENSIONS.source;

    return {
        left:node.x-dim.width/2,
        right:node.x+dim.width/2,
        top:node.y-dim.height/2,
        bottom:node.y+dim.height/2
    };
}

function rectsOverlap(a,b,margin){
    return !(
        a.right+margin<b.left ||
        a.left-margin>b.right ||
        a.bottom+margin<b.top ||
        a.top-margin>b.bottom
    );
}

function boxOverlapsExisting(box,margin,excludeIds){
    return nodes.some(n=>{
        if(excludeIds && excludeIds.includes(n.id)) return false;
        return rectsOverlap(box,getNodeRect(n),margin);
    });
}

function findFreeClusterOrigin(preferredX,preferredY,clusterWidth,clusterHeight,excludeIds){
    const box=(x,y)=>({
        left:x,
        right:x+clusterWidth,
        top:y,
        bottom:y+clusterHeight
    });

    if(!boxOverlapsExisting(box(preferredX,preferredY),24,excludeIds)){
        return {x:preferredX,y:preferredY};
    }

    const step=70;

    for(let radius=step;radius<=3000;radius+=step){
        const attempts=Math.max(10,Math.floor(radius/35));

        for(let i=0;i<attempts;i++){
            const angle=(i/attempts)*Math.PI*2;
            const x=preferredX+Math.cos(angle)*radius;
            const y=preferredY+Math.sin(angle)*radius*.7;

            if(!boxOverlapsExisting(box(x,y),24,excludeIds)){
                return {x,y};
            }
        }
    }

    return {x:preferredX,y:preferredY+3000};
}

function placeClusterNoOverlap(positions,excludeIds){
    if(positions.length===0) return positions;

    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

    positions.forEach(p=>{
        minX=Math.min(minX,p.x);
        minY=Math.min(minY,p.y);
        maxX=Math.max(maxX,p.x);
        maxY=Math.max(maxY,p.y);
    });

    const pad=140;

    const preferredX=minX-pad;
    const preferredY=minY-pad;
    const clusterWidth=(maxX-minX)+pad*2;
    const clusterHeight=(maxY-minY)+pad*2;

    const free=findFreeClusterOrigin(
        preferredX,
        preferredY,
        clusterWidth,
        clusterHeight,
        excludeIds
    );

    const dx=free.x-preferredX;
    const dy=free.y-preferredY;

    return positions.map(p=>({
        ...p,
        x:p.x+dx,
        y:p.y+dy
    }));
}

function addNode(data){
    const node={
        id:nextNodeId++,
        x:data.x ?? 0,
        y:data.y ?? 0,
        type:data.type || "source",
        title:data.title || "Untitled",
        source:data.source || "SOURCE",
        subtitle:data.subtitle || "",
        url:data.url || "",
        description:data.description || "",
        icon:data.icon || iconGlobe()
    };

    nodes.push(node);
    render();

    return node;
}

function addEdge(a,b){
    if(!a || !b || a.id===b.id) return;

    const exists=edges.some(e=>
        (e.a===a.id && e.b===b.id) ||
        (e.a===b.id && e.b===a.id)
    );

    if(!exists){
        edges.push({
            a:a.id,
            b:b.id
        });
    }

    render();
}

function removeNode(node){
    if(!node) return;

    nodes=nodes.filter(n=>n.id!==node.id);

    edges=edges.filter(e=>
        e.a!==node.id &&
        e.b!==node.id
    );

    if(selectedNode?.id===node.id){
        selectedNode=null;
    }

    render();
}

function render(){
    nodesLayer.innerHTML="";
    edgeLayer.innerHTML="";

    edges.forEach(edge=>{
        const a=nodes.find(n=>n.id===edge.a);
        const b=nodes.find(n=>n.id===edge.b);

        if(!a || !b) return;

        const path=document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const curve=Math.max(80,Math.abs(dx)*.35);

        const c1x=a.x+(dx>=0?curve:-curve);
        const c2x=b.x-(dx>=0?curve:-curve);

        path.setAttribute(
            "d",
            `M ${a.x+10000} ${a.y+10000}
             C ${c1x+10000} ${a.y+10000},
               ${c2x+10000} ${b.y+10000},
               ${b.x+10000} ${b.y+10000}`
        );

        path.setAttribute(
            "class",
            "edge"
        );

        edgeLayer.appendChild(path);
    });

    nodes.forEach(node=>{
        const el=document.createElement("div");

        el.className=
            `node ${node.type} ${selectedNode?.id===node.id?"selected":""}`;

        el.style.left=`${node.x}px`;
        el.style.top=`${node.y}px`;

        el.innerHTML=`
            <div class="node-header">
                <div class="node-logo">${node.icon}</div>
                <div class="node-source">${escapeHTML(node.source)}</div>
            </div>

            <div class="node-body">
                <div class="node-title">${escapeHTML(node.title)}</div>
                <div class="node-sub">${escapeHTML(node.subtitle)}</div>
                ${
                    node.url
                    ? `<div class="node-url">${escapeHTML(node.url)}</div>`
                    : ""
                }
            </div>
        `;

        el.addEventListener("mousedown",e=>{
            if(e.button!==0) return;

            e.stopPropagation();

            selectedNode=node;

            const p=screenToWorld(e.clientX,e.clientY);

            draggingNode=node;

            dragOffsetX=node.x-p.x;
            dragOffsetY=node.y-p.y;

            updateSelectionBar();
            render();
        });

        el.addEventListener("contextmenu",e=>{
            e.preventDefault();
            e.stopPropagation();

            selectedNode=node;
            contextNode=node;

            updateSelectionBar();
            render();

            openContextMenu(
                e.clientX,
                e.clientY,
                node.title
            );
        });

        el.addEventListener("dblclick",e=>{
            e.preventDefault();
            e.stopPropagation();

            if(node.url){
                window.open(node.url,"_blank","noopener,noreferrer");
            }
        });

        nodesLayer.appendChild(el);
    });
}

function centerOnNode(node){
    if(!node) return;

    panX=window.innerWidth/2-node.x*scale;
    panY=window.innerHeight/2-node.y*scale;

}

function fitView(){
    if(nodes.length===0){
        panX=window.innerWidth/2;
        panY=window.innerHeight/2;
        scale=1;
        updateTransform();
        return;
    }

    let minX=Infinity;
    let minY=Infinity;
    let maxX=-Infinity;
    let maxY=-Infinity;

    nodes.forEach(n=>{
        minX=Math.min(minX,n.x-140);
        minY=Math.min(minY,n.y-80);
        maxX=Math.max(maxX,n.x+140);
        maxY=Math.max(maxY,n.y+80);
    });

    const width=maxX-minX;
    const height=maxY-minY;

    const sx=(window.innerWidth-160)/width;
    const sy=(window.innerHeight-180)/height;

    scale=Math.max(.25,Math.min(1.35,Math.min(sx,sy)));

    panX=
        window.innerWidth/2-
        ((minX+maxX)/2)*scale;

    panY=
        window.innerHeight/2-
        ((minY+maxY)/2)*scale;

    updateTransform();
}

function layoutBatch(count,cols,cellW,cellH,startY){
    const rows=Math.max(1,Math.ceil(count/cols));
    const positions=[];

    for(let i=0;i<count;i++){
        const col=i%cols;
        const row=Math.floor(i/cols);

        positions.push({
            x:(col-(cols-1)/2)*cellW,
            y:startY+row*cellH
        });
    }

    return {
        positions,
        nextY:startY+(rows-1)*cellH+220
    };
}

function buildUsernameVariants(value){
    const clean=value
        .trim()
        .replace(/\s+/g," ")
        .replace(/^@/,"");

    const variants=new Set();

    variants.add(clean);

    if(clean.includes(" ")){
        const parts=clean
            .toLowerCase()
            .split(" ")
            .filter(Boolean);

        if(parts.length>=2){
            variants.add(parts.join(""));
            variants.add(parts.join("."));
            variants.add(parts.join("_"));
            variants.add(parts.join("-"));
            variants.add(parts[0]+parts[parts.length-1]);
            variants.add(parts[0]+"_"+parts[parts.length-1]);
        }
    }

    const base=clean
        .toLowerCase()
        .replace(/[^a-z0-9._-]/g,"");

    if(base){
        variants.add(base);
        variants.add(base+"_");
        variants.add("the"+base);
        variants.add(base+"dev");
        variants.add(base+"01");
        variants.add(base+"1");
    }

    return [...variants]
        .filter(Boolean)
        .slice(0,12);
}

async function analyze(){
    const value=targetInput.value.trim();
    const type=sourceSelect.value;

    if(!value){
        showToast("Inserisci un target");
        targetInput.focus();
        return;
    }

    if(value.length>200){
        showToast("Target troppo lungo (max 200 caratteri)");
        return;
    }

    setLoading(true,"BUILDING REAL SEARCH SOURCES");

    await new Promise(resolve=>requestAnimationFrame(resolve));

    resetWorkspace();

    const root=createTarget(value,type);

    addSocialSources(root,value);

    let cursorY=260;

    cursorY=addWebSources(root,value,cursorY);
    cursorY=addTypeSources(root,value,type,cursorY);

    if(type==="username"){
        cursorY=addDeepProfileScan(root,value,cursorY);
    }

    if(
        type==="username" ||
        type==="name" ||
        type==="keyword"
    ){
        cursorY=addVariantSearches(root,value,cursorY);
    }

    addDorkNode(root,value,cursorY);

    centerOnNode(root);
    render();

    setLoading(false);

    $("status").textContent=
        `${nodes.length} SOURCES · ${edges.length} CONNECTIONS · NO FABRICATED RESULTS`;

    showToast(
        `${nodes.length-1} search sources prepared`
    );
}

                    "_blank",
                    "noopener,noreferrer"
                );
            });
        });

    modal.classList.add("visible");
}

function openSources(){
    const root=nodes.find(n=>n.type==="target");

    if(!root){
        showToast("Prima crea un target");
        return;
    }

    $("modalTitle").textContent="SEARCH SOURCES";

    $("modalBody").innerHTML=`
        <div class="source-info">
            <div class="source-info-title">
                ${escapeHTML(root.title)}
            </div>
            <div class="source-info-text">
                Target type: ${escapeHTML(root.source)}<br>
                Le card presenti sulla mappa sono query/source
                realmente apribili. Non rappresentano automaticamente
                risultati confermati.
            </div>
        </div>

        <div class="dork-list">
            ${nodes
                .filter(n=>n.type==="source")
                .map(n=>`
                    <div class="dork">
                        <div>
                            <div class="dork-code">
                                ${escapeHTML(n.title)}
                            </div>
                            <div style="color:#555;font:8px JetBrains Mono,monospace;margin-top:4px">
                                ${escapeHTML(n.source)}
                            </div>
                        </div>

                        ${
                            n.url
                            ? `<button class="dork-open"
                                data-url="${escapeHTML(n.url)}">
                                OPEN
                               </button>`
                            : ""
                        }
                    </div>
                `)
                .join("")}
        </div>
    `;

    $("modalBody")
        .querySelectorAll("[data-url]")
        .forEach(btn=>{
            btn.addEventListener("click",()=>{
                window.open(
                    btn.dataset.url,
                    "_blank",
                    "noopener,noreferrer"
                );
            });
        });

    modal.classList.add("visible");
}

function openSearchForNode(node){
    if(!node) return;

    const q=node.title;

    window.open(
        `https://www.google.com/search?q=${encodeURIComponent('"'+q+'"')}`,
        "_blank",
        "noopener,noreferrer"
    );
}

function addConnectedNode(){
    if(!contextNode) return;

    const placed=placeClusterNoOverlap(
        [{x:contextNode.x+290,y:contextNode.y+130}],
        [contextNode.id]
    )[0];

    const n=addNode({
        x:placed.x,
        y:placed.y,
        type:"source",
        title:"New source",
        source:"MANUAL",
        subtitle:"User-created source",
        url:`https://www.google.com/search?q=${encodeURIComponent(contextNode.title)}`,
        icon:iconSource()
    });

    addEdge(contextNode,n);

    selectedNode=n;
    contextNode=n;

    updateSelectionBar();
    render();

    showToast("Connected node created");
}

function addManualSource(){
    if(!contextNode) return;

    const url=prompt("URL della fonte:");

    if(!url) return;

    let parsed;

    try{
        parsed=new URL(url.trim());
    }catch{
        showToast("URL non valido");
        return;
    }

    if(parsed.protocol!=="http:" && parsed.protocol!=="https:"){
        showToast("Sono ammessi solo URL http/https");
        return;
    }

    const title=prompt(
        "Nome della fonte:",
        parsed.hostname
    );

    const placed=placeClusterNoOverlap(
        [{x:contextNode.x+290,y:contextNode.y}],
        [contextNode.id]
    )[0];

    const n=addNode({
        x:placed.x,
        y:placed.y,
        type:"source",
        title:(title || parsed.hostname).slice(0,80),
        source:"MANUAL SOURCE",
        subtitle:"Externally supplied source",
        url:parsed.href,
        icon:iconSource()
    });

    addEdge(contextNode,n);

    selectedNode=n;

    updateSelectionBar();
    render();

    showToast("Source added");
}

function extractToolsFromNode(){
    if(!contextNode) return;

    const baseX=contextNode.x;
    const baseY=contextNode.y;

    const selectedTools=representativeTools(12);

    const rawPositions=selectedTools.map((tool,index)=>({
        x:baseX-330+(index%4)*220,
        y:baseY+180+Math.floor(index/4)*145,
        tool
    }));

    const placed=placeClusterNoOverlap(rawPositions,[contextNode.id]);

    placed.forEach(p=>{
        const n=addNode({
            x:p.x,
            y:p.y,
            type:"tool",
            title:p.tool[0],
            source:"TOOLKIT",
            subtitle:p.tool[1],
            url:p.tool[2],
            icon:iconTool()
        });

        addEdge(contextNode,n);
    });

    render();

    showToast("Toolkit extracted into workspace");
}

contextMenu.querySelectorAll(".context-item")
.forEach(button=>{
    button.addEventListener("click",()=>{
        const action=button.dataset.action;

        closeContextMenu();

        if(action==="add"){
            addConnectedNode();
        }

        if(action==="source"){
            addManualSource();
        }

        if(action==="search"){
            openSearchForNode(contextNode);
        }

        if(action==="dorks"){
            openDorks(contextNode?.title);
        }

        if(action==="tools"){
            extractToolsFromNode();
        }

        if(action==="delete"){
            removeNode(contextNode);
            contextNode=null;
        }
    });
});

workspace.addEventListener("mousedown",e=>{
    if(e.button!==0) return;

    if(e.target!==workspace &&
       e.target.id!=="grid"){
        return;
    }

    isPanning=true;

    workspace.classList.add("dragging");

    panStartX=e.clientX-panX;
    panStartY=e.clientY-panY;
});

workspace.addEventListener("contextmenu",e=>{
    if(e.target===workspace || e.target.id==="grid"){
        e.preventDefault();
        closeContextMenu();
    }
});

window.addEventListener("mousemove",e=>{
    if(draggingNode){
        const p=screenToWorld(e.clientX,e.clientY);

        draggingNode.x=
            p.x+dragOffsetX;

        draggingNode.y=
            p.y+dragOffsetY;

        scheduleRender();

        return;
    }

    if(isPanning){
        panX=e.clientX-panStartX;
        panY=e.clientY-panStartY;

        updateTransform();
    }
});

window.addEventListener("mouseup",()=>{
    draggingNode=null;
    isPanning=false;

    workspace.classList.remove("dragging");
});

workspace.addEventListener("wheel",e=>{
    e.preventDefault();

    const before=screenToWorld(
        e.clientX,
        e.clientY
    );

    const factor=e.deltaY<0?1.1:.9;

    scale=Math.max(
        .2,
        Math.min(3.5,scale*factor)
    );

    panX=
        e.clientX-
        before.x*scale;

    panY=
        e.clientY-
        before.y*scale;

    updateTransform();
},{
    passive:false
});

$("runSearch").addEventListener(
    "click",
    analyze
);

targetInput.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            analyze();
        }
    }
);

$("resetButton").addEventListener(
    "click",
    resetWorkspace
);

$("toolsButton").addEventListener(
    "click",
    openTools
);

$("sourcesButton").addEventListener(
    "click",
    openSources
);

$("dorksButton").addEventListener(
    "click",
    ()=>openDorks()
);

$("zoomIn").addEventListener(
    "click",
    ()=>{
        scale=Math.min(3.5,scale*1.15);
        updateTransform();
    }
);

$("zoomOut").addEventListener(
    "click",
    ()=>{
        scale=Math.max(.2,scale/1.15);
        updateTransform();
    }
);

$("fitView").addEventListener(
    "click",
    fitView
);

$("openSelected").addEventListener(
    "click",
    ()=>{
        if(selectedNode?.url){
            window.open(
                selectedNode.url,
                "_blank",
                "noopener,noreferrer"
            );
        }else{
            showToast("No external source");
        }
    }
);

$("searchSelected").addEventListener(
    "click",
    ()=>{
        openSearchForNode(selectedNode);
    }
);

$("deleteSelected").addEventListener(
    "click",
    ()=>{
        removeNode(selectedNode);
        updateSelectionBar();
    }
);

document.querySelectorAll(".tool-button")
.forEach(button=>{
    button.addEventListener("click",()=>{
        const tool=button.dataset.tool;

        if(tool==="tools"){
            openTools();
        }

        if(tool==="dorks"){
            openDorks();
        }

        if(tool==="web"){
            const value=
                selectedNode?.title ||
                targetInput.value.trim();

            if(value){
                window.open(
                    `https://www.google.com/search?q=${encodeURIComponent('"'+value+'"')}`,
                    "_blank",
                    "noopener,noreferrer"
                );
            }
        }

        if(tool==="social"){
            const value=
                selectedNode?.title ||
                targetInput.value.trim();

            if(value){
                const root=selectedNode ||
                    nodes.find(n=>n.type==="target");

                if(root){
                    addSocialSources(root,value);
                    render();
                    showToast("Social search sources added");
                }
            }
        }
    });
});

$("modalClose").addEventListener(
    "click",
    ()=>{
        modal.classList.remove("visible");
    }
);

modal.addEventListener(
    "mousedown",
    e=>{
        if(e.target===modal){
            modal.classList.remove("visible");
        }
    }
);

document.addEventListener(
    "click",
    e=>{
        if(!contextMenu.contains(e.target)){
            closeContextMenu();
        }
    }
);

document.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Escape"){
            closeContextMenu();
            modal.classList.remove("visible");
        }

        if(
            (e.key==="Delete" || e.key==="Backspace") &&
            selectedNode &&
            document.activeElement!==targetInput
        ){
            removeNode(selectedNode);
            updateSelectionBar();
        }
    }
);

window.addEventListener(
    "resize",
    ()=>{
        if(nodes.length===0){
            panX=window.innerWidth/2;
            panY=window.innerHeight/2;
            updateTransform();
        }
    }
);

updateTransform();
render();
</script>

</body>
</html>
